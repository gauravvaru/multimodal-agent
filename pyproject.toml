[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-agent"
version = "0.1.0"
description = "Production-oriented multimodal agentic intelligence platform"
readme = "PROJECT_SPEC.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "uvicorn",
    "langgraph",
    "langchain",
    "langchain-core",
    "langchain-google-genai",
    "sse-starlette",
    "python-multipart",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
media = [
    "pypdf",
    "faster-whisper",
    "pytesseract",
    "pdf2image",
    "youtube-transcript-api"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["multimodal_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
