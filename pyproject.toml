[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-agent"
version = "0.1.0"
description = "Production-oriented multimodal agentic intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.141",
    "pydantic~=2.13",
    "pydantic-settings~=2.15",
    "uvicorn~=0.52",
    "langgraph~=1.2",
    "langchain-core~=1.5",
    "langchain-google-genai~=4.3",
    "sse-starlette~=3.4",
    "python-multipart~=0.0.32",
    "numpy~=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
media = [
    "pypdf~=6.15",
    "faster-whisper~=1.2",
    "pytesseract~=0.3",
    "pdf2image~=1.17",
    "youtube-transcript-api~=1.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["multimodal_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
