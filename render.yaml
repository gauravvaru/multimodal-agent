# Render Blueprint — two-service deployment
# https://render.com/docs/blueprint-spec

services:
  # ── Backend API (Docker) ──────────────────────────────────────────────
  - type: web
    name: multimodal-agent-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # must be set manually in the Render dashboard
      - key: LLM_MODEL
        value: gemini-3.5-flash
      - key: LLM_PROVIDER
        value: google

  # ── Frontend Static Site ──────────────────────────────────────────────
  - type: web
    name: multimodal-agent-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: multimodal-agent-api
          type: web
          property: host       # resolves to https://<service>.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
